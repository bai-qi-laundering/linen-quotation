f=u;a.download=`${state.hotel.replace(/[\\/:*?"<>|]/g,'_')}_報價設定.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>4000000)throw Error();let candidate=validate(JSON.parse(await f.text()));if(!confirm('匯入後會取代目前設定，是否繼續？'))return;state=candidate;save();sync()}catch(e){alert('匯入失敗，請使用本工具匯出的有效 JSON 設定檔。')}finally{$('jsonFile').value=''}};$('reset').onclick=()=>{if(confirm('確定重設為公版？目前設定與 QR 圖片將被取代。')){state=defaults();save();sync()}};$('qrUpload').onclick=()=>$('qrFile').click();$('qrClear').onclick=()=>{state.qr='';save();render()};$('qrFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2000000)throw Error();let url=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let canvas=document.createElement('canvas'),scale=Math.min(1,600/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/png');if(!validQr(data))throw Error();state.qr=data;save();render()}catch(e){alert('請上傳 2 MB 以內的 PNG、JPEG 或 WebP 圖片。')}finally{$('qrFile').value=''}};sync();
</script></html>
